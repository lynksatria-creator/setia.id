name: Deploy to VPS

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS via SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$VPS_HOST" || -z "$VPS_USER" || -z "$VPS_SSH_KEY" ]]; then
            echo "::error::Set VPS_HOST, VPS_USER, and VPS_SSH_KEY in repository Actions secrets."
            exit 1
          fi

          install -m 700 -d "$HOME/.ssh"
          key_file="$HOME/.ssh/setia-vps-deploy"
          known_hosts_file="$HOME/.ssh/known_hosts"
          printf '%s\n' "$VPS_SSH_KEY" > "$key_file"
          chmod 600 "$key_file"
          if ! ssh-keygen -y -f "$key_file" >/dev/null; then
            echo "::error::VPS_SSH_KEY is not a valid, unencrypted OpenSSH private key."
            exit 1
          fi
          if ! ssh-keyscan -T 10 -H "$VPS_HOST" > "$known_hosts_file" 2>/dev/null || [[ ! -s "$known_hosts_file" ]]; then
            echo "::error::Could not retrieve the SSH host key from VPS_HOST on port 22."
            exit 1
          fi
          chmod 600 "$known_hosts_file"

          ssh \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$known_hosts_file" \
            -i "$key_file" \
            "$VPS_USER@$VPS_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          cd /opt/setia.id
          git fetch origin
          git checkout main
          git reset --hard origin/main
          mongo_target="$(python3 - <<'PY'
          import ipaddress
          import re
          import shlex
          import subprocess
          from pathlib import Path
          from urllib.parse import urlsplit

          unit = "auroramedia-api.service"

          def systemd_property(name):
              result = subprocess.run(
                  ["systemctl", "show", unit, f"--property={name}", "--value"],
                  capture_output=True,
                  text=True,
                  check=False,
              )
              return result.stdout.strip() if result.returncode == 0 else None

          def env_file_value(path):
              try:
                  lines = Path(path).read_text(encoding="utf-8").splitlines()
              except OSError:
                  return None
              value = None
              for line in lines:
                  line = line.strip()
                  if not line or line.startswith("#"):
                      continue
                  if line.startswith("export "):
                      line = line[7:].lstrip()
                  key, separator, candidate = line.partition("=")
                  if separator and key.strip() == "MONGO_URL":
                      candidate = candidate.strip()
                      if len(candidate) >= 2 and candidate[0] == candidate[-1] and candidate[0] in "\"'":
                          candidate = candidate[1:-1]
                      value = candidate
              return value

          mongo_url = None
          environment = systemd_property("Environment")
          if environment:
              for entry in shlex.split(environment):
                  key, separator, value = entry.partition("=")
                  if separator and key == "MONGO_URL":
                      mongo_url = value

          environment_files = systemd_property("EnvironmentFiles")
          if mongo_url is None and environment_files and environment_files != "-":
              paths = re.findall(r"([^\s]+) \(ignore_errors=(?:yes|no)\)", environment_files)
              if not paths:
                  print("unknown-env-files")
                  raise SystemExit
              for path in paths:
                  configured_url = env_file_value(path)
                  if configured_url is not None:
                      mongo_url = configured_url

          if mongo_url is None:
              mongo_url = env_file_value("/opt/auroramedia-api/app/.env")

          if mongo_url is None:
              print("default-local")
          elif not mongo_url.strip():
              print("unknown-empty-url")
          else:
              try:
                  parsed = urlsplit(mongo_url)
                  port = parsed.port
              except ValueError:
                  print("unknown-invalid-uri")
              else:
                  if parsed.scheme not in {"mongodb", "mongodb+srv"} or not parsed.hostname:
                      print("unknown-unsupported-uri")
                  else:
                      try:
                          local_host = parsed.hostname.lower() == "localhost" or ipaddress.ip_address(parsed.hostname).is_loopback
                      except ValueError:
                          local_host = False
                      if local_host:
                          if parsed.scheme != "mongodb":
                              print("unknown-loopback-endpoint")
                          elif port in {None, 27017}:
                              print("local")
                          elif port:
                              print(f"local-custom:{port}")
                          else:
                              print("unknown-invalid-port")
                      else:
                          print("external")
          PY
          )"
          mongo_port=27017
          if [[ "$mongo_target" == local-custom:* ]]; then
            mongo_port="${mongo_target#local-custom:}"
            if [[ ! "$mongo_port" =~ ^[0-9]{1,5}$ ]] || (( mongo_port < 1 || mongo_port > 65535 )); then
              echo "::error::MongoDB local port is invalid."
              exit 1
            fi
            mongo_target="local"
          fi
          printf 'MongoDB target classification: %s (port %s)\n' "$mongo_target" "$mongo_port"

          mongo_service=""
          for candidate in mongod mongodb; do
            if systemctl cat "$candidate.service" >/dev/null 2>&1; then
              mongo_service="$candidate.service"
              break
            fi
          done

          case "$mongo_target" in
            local|default-local)
              if [[ -n "$mongo_service" ]]; then
                if ! systemctl is-active --quiet "$mongo_service"; then
                  echo "Starting inactive MongoDB service."
                  systemctl start "$mongo_service"
                fi
                systemctl is-active --quiet "$mongo_service"
              else
                existing_data=false
                for data_dir in /var/lib/mongodb /data/db; do
                  if [[ -d "$data_dir" ]] && find "$data_dir" -mindepth 1 -maxdepth 1 -print -quit | grep -q .; then
                    existing_data=true
                    break
                  fi
                done
                if command -v mongod >/dev/null 2>&1 || [[ -f /etc/mongod.conf ]] || [[ "$existing_data" == true ]]; then
                  echo "::error::MongoDB files or data exist but no systemd service is installed. Refusing to replace or initialize the database automatically."
                  exit 1
                fi

                . /etc/os-release
                case "${ID}:${VERSION_ID}" in
                  ubuntu:22.04) mongo_repo_distribution="jammy" ;;
                  ubuntu:24.04) mongo_repo_distribution="noble" ;;
                  debian:12) mongo_repo_distribution="bookworm" ;;
                  *)
                    echo "::error::Automatic MongoDB installation is supported only on Ubuntu 22.04/24.04 and Debian 12."
                    exit 1
                    ;;
                esac
                mongo_architecture="$(dpkg --print-architecture)"
                if [[ "$mongo_architecture" != "amd64" && "$mongo_architecture" != "arm64" ]]; then
                  echo "::error::Automatic MongoDB installation is not supported on this VPS architecture."
                  exit 1
                fi

                echo "Installing MongoDB 8.0 because the backend targets localhost and no existing MongoDB data/configuration was found."
                apt-get update
                DEBIAN_FRONTEND=noninteractive apt-get install -y ca-certificates curl gnupg
                install -d -m 0755 /usr/share/keyrings
                curl --fail --silent --show-error https://pgp.mongodb.com/server-8.0.asc |
                  gpg --dearmor --yes -o /usr/share/keyrings/mongodb-server-8.0.gpg
                printf 'deb [ arch=%s signed-by=/usr/share/keyrings/mongodb-server-8.0.gpg ] https://repo.mongodb.org/apt/%s %s/mongodb-org/8.0 multiverse\n' \
                  "$mongo_architecture" "$ID" "$mongo_repo_distribution" \
                  > /etc/apt/sources.list.d/mongodb-org-8.0.list
                apt-get update
                DEBIAN_FRONTEND=noninteractive apt-get install -y mongodb-org
                if [[ "$mongo_port" != "27017" ]]; then
                  systemctl stop mongod.service
                  python3 - "$mongo_port" <<'PY'
          import re
          import sys
          from pathlib import Path

          config = Path("/etc/mongod.conf")
          text = config.read_text(encoding="utf-8")
          updated, replacements = re.subn(
              r"(?m)^(\s*port:\s*)27017(\s*(?:#.*)?)$",
              rf"\g<1>{int(sys.argv[1])}\g<2>",
              text,
              count=1,
          )
          if replacements != 1:
              raise SystemExit("Could not safely set the MongoDB port in its default configuration.")
          config.write_text(updated, encoding="utf-8")
          PY
                fi
                systemctl enable --now mongod.service
                mongo_service="mongod.service"
              fi
              systemctl is-active --quiet "$mongo_service"
              if [[ "$mongo_service" == "mongod.service" ]] &&
                grep -Eq '^[[:space:]]*bindIp:[[:space:]]*"127\.0\.0\.1,::1"[[:space:]]*$' /etc/mongod.conf; then
                python3 <<'PY'
          import re
          from pathlib import Path

          config = Path("/etc/mongod.conf")
          text = config.read_text(encoding="utf-8")
          updated, replacements = re.subn(
              r'(?m)^(\s*bindIp:\s*)"127\.0\.0\.1,::1"(\s*)$',
              r"\g<1>127.0.0.1\g<2>",
              text,
              count=1,
          )
          if replacements != 1:
              raise SystemExit("Could not safely restore MongoDB IPv4 loopback.")
          config.write_text(updated, encoding="utf-8")
          PY
                systemctl restart "$mongo_service"
                systemctl is-active --quiet "$mongo_service"
              fi
              echo "MongoDB service is active."
              python3 - "$mongo_port" <<'PY'
          import socket
          import sys

          port = int(sys.argv[1])
          reachable = False
          for label, address in (("IPv4", "127.0.0.1"), ("IPv6", "::1")):
              family = socket.AF_INET6 if ":" in address else socket.AF_INET
              try:
                  with socket.socket(family, socket.SOCK_STREAM) as connection:
                      connection.settimeout(2)
                      connection.connect((address, port))
                  endpoint_reachable = True
              except OSError:
                  endpoint_reachable = False
              reachable = reachable or endpoint_reachable
              print(f"MongoDB {label} loopback probe: {'reachable' if endpoint_reachable else 'unavailable'}")
          if not reachable:
              raise SystemExit("MongoDB service is active but not listening on the configured loopback port.")
          PY
              ;;
            external)
              echo "Using the configured external MongoDB endpoint; no local database will be installed or started."
              ;;
            unknown*)
              echo "::error::MongoDB endpoint configuration could not be safely classified ($mongo_target); refusing to install or replace a database."
              exit 1
              ;;
            *)
              echo "::error::Unexpected MongoDB target classification; refusing to install or replace a database."
              exit 1
              ;;
          esac
          npm install
          BACKEND_FILE=/opt/auroramedia-api/app/server.py
          cp -a "$BACKEND_FILE" "$BACKEND_FILE.bak-$(date +%Y%m%d%H%M%S)"
          cp -a backend/server.py "$BACKEND_FILE"
          VITE_BASE=/ npm run build
          cp -a dist/. /var/www/auroramedia-sites/current/
          nginx -t
          systemctl reload nginx
          systemctl restart auroramedia-api.service
          if ! curl --fail --silent --show-error --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:8000/api/public/portal-ads; then
            echo "::error::API health check failed. Recent service exception types and sanitized connection indicators:"
            journalctl -u auroramedia-api.service --since "10 minutes ago" --no-pager --output=cat 2>/dev/null |
              python3 -c '
          import re
          import sys

          pattern = re.compile(r"^([A-Za-z_][A-Za-z0-9_.]*(?:Error|Exception))(?::|$)")
          indicators = {
              "connection_refused": ("connection refused", "errno 111"),
              "dns_resolution": ("temporary failure in name resolution", "name or service not known", "getaddrinfo failed"),
              "network_unreachable": ("network is unreachable", "no route to host"),
              "authentication": ("authentication failed", "authenticationfailure", "bad auth"),
              "tls": ("ssl handshake", "tlsv1 alert", "certificate verify failed"),
              "timeout": ("timed out", "timeout"),
          }
          exception_types = set()
          connection_indicators = set()
          for line in sys.stdin:
              match = pattern.match(line)
              if match:
                  exception_types.add(match.group(1))
              lowered = line.lower()
              for indicator, phrases in indicators.items():
                  if any(phrase in lowered for phrase in phrases):
                      connection_indicators.add(indicator)
          print(", ".join(sorted(exception_types)) if exception_types else "No exception type found in service journal.")
          print("Sanitized connection indicators: " + (", ".join(sorted(connection_indicators)) if connection_indicators else "none found"))
          '
            exit 1
          fi
          REMOTE
